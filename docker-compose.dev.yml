version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ev-charge-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evcharge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evcharge123}
      POSTGRES_DB: ${POSTGRES_DB:-ev_charge_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evcharge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ev-charge-network-dev

volumes:
  postgres_data_dev:

networks:
  ev-charge-network-dev:
    driver: bridge

